[project]
name = "timecode-backend"
version = "0.1.0"
description = "타임코드(TimeCode) — BSSM 시간표 서비스 API"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.5",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.2",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.8",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
