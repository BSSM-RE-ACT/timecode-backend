# 개발 환경: docker compose up -d  → API http://localhost:8000/api/docs
services:
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: timecode
      POSTGRES_PASSWORD: timecode
      POSTGRES_DB: timecode
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    command: ["postgres", "-c", "timezone=Asia/Seoul"]
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timecode"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: .
    restart: always
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://timecode:timecode@db:5432/timecode
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes: [./app:/app/app, ./alembic:/app/alembic]
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]

volumes:
  db-data:
